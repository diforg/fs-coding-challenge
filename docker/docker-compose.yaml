services:
  # Servidor PHP (Backend)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fscc-php_app
    working_dir: /var/www/html
    volumes:
      - ../src:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=myapp
      - DB_USER=root
      - DB_PASSWORD=secret
    depends_on:
      - mysql
    networks:
      - app-network

  # Servidor Web (Nginx)
  webserver:
    image: nginx:alpine
    container_name: fscc-nginx_server
    working_dir: /var/www/html
    volumes:
      - ../src:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - app-network

  # Banco de dados (MySQL)
  mysql:
    image: mysql:8.0
    container_name: fscc-mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: myapp
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "33066:3306"
    networks:
      - app-network

  # Servidor Vite (Frontend) - Desenvolvimento
  frontend:
    image: node:18-alpine
    container_name: fscc-vite_frontend
    working_dir: /app
    volumes:
      - ../src:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:80
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - webserver
    networks:
      - app-network

  # PHPMyAdmin (Opcional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fscc-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local